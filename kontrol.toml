[build.default]
foundry-project-root       = '.'
regen                      = true
rekompile                  = true
verbose                    = false
debug                      = false
require                    = 'verification/kontrol/octant-lemmas.k'
module-import              = ['YDStrategyTest:OCTANT-LEMMAS', 'YSStrategyTest:OCTANT-LEMMAS', 'YDERC4626Test:OCTANT-LEMMAS', 'YSERC4626Test:OCTANT-LEMMAS']
auxiliary-lemmas           = true

[prove.default]
foundry-project-root       = '.'
schedule                   = 'CANCUN'
verbose                    = false
debug                      = false
max-depth                  = 100000
max-iterations             = 10000
reinit                     = false
cse                        = false
workers                    = 1
max-frontier-parallel      = 6
maintenance-rate           = 128
assume-defined             = false
no-log-succ-rewrites       = true
no-stack-checks            = true
optimize-kcfg              = true
kore-rpc-command           = 'kore-rpc-booster --no-post-exec-simplify --equation-max-recursion 20 --equation-max-iterations 1000 --fallback-on Aborted'
failure-information        = true
counterexample-information = true
minimize-proofs            = false
fail-fast                  = true
smt-timeout                = 60000
smt-retry-limit            = 0
break-every-step           = false
break-on-jumpi             = false
break-on-calls             = false
break-on-storage           = false
break-on-basic-blocks      = false
break-on-cheatcodes        = false
auto_abstract              = true
run-constructor            = false
match-test                 = [
        # ============================================
        # YearnPolygonUsdcStrategy proofs (RETIRED -- Dragon-based)
        # ============================================
        #"YearnPolygonUsdcStrategyKontrolTest.testDeposit(uint256,address)",
        #"YearnPolygonUsdcStrategyKontrolTest.testDepositWithLockup(uint256,address,uint256)",
        #"YearnPolygonUsdcStrategyKontrolTest.testMint(uint256,address)",
        #"YearnPolygonUsdcStrategyKontrolTest.testMintWithLockup(uint256,address,uint256)",
        #"YearnPolygonUsdcStrategyKontrolTest.testWithdraw(uint256,address,address,uint256)",
        #"YearnPolygonUsdcStrategyKontrolTest.testWithdrawWithLossReverts(uint256,address,address,uint256)",
        #"YearnPolygonUsdcStrategyKontrolTest.testWithdrawRevert(uint256,address,address,uint256)",
        #"YearnPolygonUsdcStrategyKontrolTest.testRedeem(uint256,address,address,uint256)",
        #"YearnPolygonUsdcStrategyKontrolTest.testRedeemRevert(uint256,address,address,uint256)",
        #"YearnPolygonUsdcStrategyKontrolTest.testMaxRedeemAllwaysReverts(uint256,address,address,uint256)",
        #"YearnPolygonUsdcStrategyKontrolTest.testInitiateRageQuit()",
        #"YearnPolygonUsdcStrategyKontrolTest.testReport()",
        #"YearnPolygonUsdcStrategyKontrolTest.testReportWithLoss()",
        #"YearnPolygonUsdcStrategyKontrolTest.testTend()",
        #"YearnPolygonUsdcStrategyKontrolTest.testSetPendingManagement(address)",
        #"YearnPolygonUsdcStrategyKontrolTest.testSetPendingManagementRevert(address,address)",
        #"YearnPolygonUsdcStrategyKontrolTest.testAcceptManagement(address)",
        #"YearnPolygonUsdcStrategyKontrolTest.testAcceptManagementRevert(address,address)",
        #"YearnPolygonUsdcStrategyKontrolTest.testSetKeeper(address)",
        #"YearnPolygonUsdcStrategyKontrolTest.testSetKeeperRevert(address,address)",
        #"YearnPolygonUsdcStrategyKontrolTest.testSetEmergencyAdmin(address)",
        #"YearnPolygonUsdcStrategyKontrolTest.testSetEmergencyAdminRevert(address,address)",
        # ============================================
        # YieldDonating strategy proofs
        # ============================================
        "YDStrategyTest.testReportProfit()",
        "YDStrategyTest.testReportLossWithBurning()",
        "YDStrategyTest.testReportLossInsufficientDragon()",
        "YDStrategyTest.testReportNoChange()",
        "YDStrategyTest.testReportLossNoBurning()",
        "YDStrategyTest.testTend()",
        "YDStrategyTest.testReportOnlyKeeper()",
        "YDStrategyTest.testReportByManagement()",
        "YDStrategyTest.testReportNotEmergencyAdmin()",
        "YDStrategyTest.testDepositYD(uint256,address)",
        "YDStrategyTest.testMintYD(uint256,address)",
        "YDStrategyTest.testWithdrawYD(uint256,address,address)",
        "YDStrategyTest.testRedeemYD(uint256,address,address)",
        # ============================================
        # YieldSkimming strategy proofs
        # ============================================
        "YSStrategyTest.testReportProfitYS()",
        "YSStrategyTest.testReportLossWithBurningYS()",
        "YSStrategyTest.testReportLossInsufficientDragonYS()",
        "YSStrategyTest.testReportNoChangeYS()",
        "YSStrategyTest.testReportLossNoBurningYS()",
        "YSStrategyTest.testDepositBlockedDuringInsolvency()",
        "YSStrategyTest.testDragonBlockedDuringInsolvency()",
        "YSStrategyTest.testDepositBlockedForDragon()",
        "YSStrategyTest.testTendYS()",
        "YSStrategyTest.testReportOnlyKeeperYS()",
        "YSStrategyTest.testReportByManagementYS()",
        "YSStrategyTest.testDepositValueDebtYS(uint256,address)",
        "YSStrategyTest.testRedeemValueDebtYS(uint256,address,address)",
        "YSStrategyTest.testTransferDragonToUser(address,uint256)",
        "YSStrategyTest.testTransferUserToDragon(address,uint256)",
        # ============================================
        # ERC4626 property tests (YieldDonating)
        # ============================================
        "YDERC4626Test.testSharesRedeemableAfterDepositYD(uint256,address)",
        "YDERC4626Test.testShutdownBlocksYD(address)",
        "YDERC4626Test.testBalanceBoundedYD(address)",
        "YDERC4626Test.testConversionConsistencyYD(uint256)",
        # ============================================
        # ERC4626 property tests (YieldSkimming)
        # ============================================
        "YSERC4626Test.testShutdownBlocksYS(address)",
        "YSERC4626Test.testBalanceBoundedYS(address)",
        "YSERC4626Test.testConversionSolventYS(uint256)",
        "YSERC4626Test.testConversionFallbackInsolventYS(uint256)",
    ]

[show.default]
foundry-project-root       = '.'
verbose                    = false
debug                      = false
