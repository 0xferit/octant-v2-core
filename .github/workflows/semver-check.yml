name: Contract Semver Check

on:
  pull_request:
    branches:
      - main
      - master
      - develop
    paths:
      - 'src/**/*.sol'
      - 'scripts/sol-semver.mjs'
      - 'foundry.toml'
      - 'remappings.txt'
      - 'soldeer.lock'

jobs:
  check-semver:
    name: Verify contract semantic version bumps
    runs-on: general
    container:
      image: ${{ vars.GCP_DOCKER_IMAGE_REGISTRY }}/node-extended:f4f41461
      credentials:
        username: _json_key_base64
        password: ${{ secrets.GCP_DOCKER_IMAGES_REGISTRY_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Init env
        run: |
          yarn install
          forge soldeer install

      - name: Check semantic version bumps in changed contracts
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.sha }}
        run: |
          MERGE_BASE=$(git -c safe.directory="$PWD" merge-base "$BASE_REF" "$HEAD_REF")
          node scripts/sol-semver.mjs check \
            --old-ref "$MERGE_BASE" \
            --new-ref "$HEAD_REF"
          # TODO: pass --lock-file semver-lock.json once the lock file workflow
          # is adopted. Lock validation in sol-semver.mjs is ready but no
          # semver-lock.json exists in the repo yet.
