name: Contract VERSION Date Check

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**/*.sol'
      - 'scripts/check-version-date.sh'

jobs:
  check-version-date:
    name: Verify VERSION matches release date
    if: github.event.pull_request.head.ref == 'develop'
    runs-on: general
    container:
      image: ${{ vars.GCP_DOCKER_IMAGE_REGISTRY }}/node-extended:f4f41461
      credentials:
        username: _json_key_base64
        password: ${{ secrets.GCP_DOCKER_IMAGES_REGISTRY_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check VERSION constants in changed contracts
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.sha }}
        run: |
          git config --global safe.directory "$PWD"
          MERGE_BASE=$(git merge-base "$BASE_REF" "$HEAD_REF")
          CHANGED_FILES=$(git diff --name-only "$MERGE_BASE" "$HEAD_REF" -- 'src/**/*.sol')
          export CHANGED_FILES
          bash scripts/check-version-date.sh
